name: "Kamal setup"
description: "Prepare a self-hosted runner to run Kamal against the FestNoz production server"

inputs:
  rails-master-key:
    description: "Contents of config/master.key (RAILS_MASTER_KEY secret)"
    required: true
  postgres-password:
    description: "Password of the festnoz PostgreSQL role (POSTGRES_PASSWORD secret)"
    required: true
  ssh-private-key:
    description: "Private key used to reach the server. Leave empty to use the SSH config of the runner user."
    required: false
    default: ""
  ssh-known-hosts:
    description: "Entries appended to ~/.ssh/known_hosts, e.g. the output of `ssh-keyscan 192.168.1.11`."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check runner prerequisites
      shell: bash
      run: |
        set -euo pipefail
        for cmd in docker git ssh; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            echo "::error::'$cmd' is not installed on this runner, Kamal cannot deploy without it"
            exit 1
          fi
        done
        if ! docker buildx version >/dev/null 2>&1; then
          echo "::error::docker buildx is missing — Kamal builds the production image on this runner"
          exit 1
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "::error::the runner user cannot talk to the Docker daemon (add it to the 'docker' group)"
          exit 1
        fi

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Write Kamal secret files
      shell: bash
      env:
        RAILS_MASTER_KEY: ${{ inputs.rails-master-key }}
        POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
      run: |
        set -euo pipefail
        if [ -z "$RAILS_MASTER_KEY" ]; then
          echo "::error::the RAILS_MASTER_KEY secret is empty — add it in Settings > Secrets and variables > Actions"
          exit 1
        fi
        if [ -z "$POSTGRES_PASSWORD" ]; then
          echo "::error::the POSTGRES_PASSWORD secret is empty — add it in Settings > Secrets and variables > Actions"
          exit 1
        fi
        # .kamal/secrets reads both files. They are git-ignored, so the working
        # tree stays clean and Kamal keeps tagging images with the commit SHA.
        umask 077
        printf '%s' "$RAILS_MASTER_KEY" > config/master.key
        printf '%s' "$POSTGRES_PASSWORD" > config/database_password.txt

    - name: Configure SSH access to the server
      if: inputs.ssh-private-key != '' || inputs.ssh-known-hosts != ''
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        if [ -n "$SSH_KNOWN_HOSTS" ]; then
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        fi
        if [ -n "$SSH_PRIVATE_KEY" ]; then
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        fi
